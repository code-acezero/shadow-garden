name: Build Signed Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://shadowgarden.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-build"
        run: pnpm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Assets
        run: pnpm cap sync android

      - name: Generate Official Release Keystore (code:4ce0)
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore \
            -alias code4ce0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "ShadowGarden@4ce0-ak" \
            -keypass "ShadowGarden@4ce0-ak" \
            -dname "CN=code:4ce0, O=Shadow Garden, C=US"

      - name: Grant Gradle Execute Permissions
        run: chmod +x android/gradlew

      - name: Build Signed Release APK via Gradle
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="ShadowGarden@4ce0-ak" \
            -Pandroid.injected.signing.key.alias=code4ce0 \
            -Pandroid.injected.signing.key.password="ShadowGarden@4ce0-ak" \
            --no-daemon

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowGarden-V1-Signed-Release_${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
