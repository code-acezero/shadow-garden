name: Build & Release Shadow Garden APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'New Shadow Garden APK release.'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://shadowgarden.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-build"
        run: pnpm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create Android Assets Directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android Assets
        run: pnpm cap sync android

      - name: Generate Official Release Keystore (code:4ce0)
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore \
            -alias code4ce0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "ShadowGarden@4ce0-ak" \
            -keypass "ShadowGarden@4ce0-ak" \
            -dname "CN=code:4ce0, O=Shadow Garden, C=US"

      - name: Grant Gradle Execute Permissions
        run: chmod +x android/gradlew

      - name: Build Signed Release APK via Gradle
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="ShadowGarden@4ce0-ak" \
            -Pandroid.injected.signing.key.alias=code4ce0 \
            -Pandroid.injected.signing.key.password="ShadowGarden@4ce0-ak" \
            --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             "ShadowGarden-V1-Signed-Release_${{ github.run_number }}.apk"

      # ✅ Always: save APK as workflow artifact (available on every push build)
      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowGarden-V1-Signed-Release_${{ github.run_number }}
          path: "ShadowGarden-V1-Signed-Release_${{ github.run_number }}.apk"
          retention-days: 30

      # 🚀 Manual trigger only: publish as a proper GitHub Release
      - name: Publish GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "Shadow Garden V1 — Build ${{ github.run_number }}"
          body: |
            🌿 **Shadow Garden Android APK**
            
            **Build**: `#${{ github.run_number }}`
            **Signed by**: `code:4ce0 | Shadow Garden`
            **Version**: `1.0.0 (code:4ce0)`
            
            ---
            ${{ github.event.inputs.release_notes }}
            
            > Install on any Android device. Enable "Install from unknown sources" in your phone settings first.
          files: "ShadowGarden-V1-Signed-Release_${{ github.run_number }}.apk"
          draft: false
          prerelease: false
