version: '3.8'

services:
  kagemi:
    build:
      context: .
      dockerfile: Dockerfile
    image: kagemi:latest
    container_name: kagemi-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - NEXT_PORT=3001
      - NEXT_URL=http://127.0.0.1:3001
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
