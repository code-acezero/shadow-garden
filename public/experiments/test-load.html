<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Seraphina Nocturne Test Load</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body style="margin:0; background:#0b0813; overflow:hidden;">
  <canvas id="c" style="width:100vw; height:100vh; display:block;"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.getElementById('c');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0813);

    const cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    cam.position.set(0, 1.2, 2.5);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const controls = new OrbitControls(cam, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffe6f5, 1.2));
    const mainLight = new THREE.DirectionalLight(0xfff5ee, 2.2);
    mainLight.position.set(2, 4, 3);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0xb070ff, 3.0);
    rimLight.position.set(-2, 3, -3);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(10, 20, 0x8a3ab9, 0x2e114d);
    grid.position.y = 0;
    scene.add(grid);

    window.characterLoaded = false;
    window.characterBones = [];
    window.characterMeshes = [];

    const loader = new GLTFLoader();
    loader.load('/models/seraphina.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);
      window.characterModel = model;
      window.characterLoaded = true;

      model.traverse(o => {
        if (o.isBone) window.characterBones.push(o.name);
        if (o.isMesh) {
          window.characterMeshes.push(o.name);
          // Ensure double sided on clothes/hair
          if (o.material) {
            o.material.side = THREE.DoubleSide;
            o.material.alphaTest = 0.5;
            o.material.needsUpdate = true;
          }
        }
      });
      console.log('Model loaded! Bones count:', window.characterBones.length, 'Meshes:', window.characterMeshes.length);
    }, undefined, (err) => {
      console.error('Load error:', err);
      window.loadError = String(err);
    });

    window.addEventListener('resize', () => {
      cam.aspect = window.innerWidth / window.innerHeight;
      cam.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, cam);
    }
    animate();
  </script>
</body>
</html>
